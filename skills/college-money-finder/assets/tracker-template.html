<title>College Search</title>
<style>
:root{--ink:#22302c;--muted:#66756e;--ground:#f6f7f5;--card:#fff;--line:#e2e6e3;--accent:#1e5b4f;--accent-soft:#e4eeeb;--good:#2e7d4f;--warn:#b7791f;--bad:#b54a35;--serif:"Iowan Old Style",Palatino,Georgia,serif;--sans:"Avenir Next","Segoe UI",system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:#e8ece9;--muted:#93a09a;--ground:#171d1b;--card:#212927;--line:#33403c;--accent:#6fb3a2;--accent-soft:#26332f;--good:#66b285;--warn:#d4a04c;--bad:#d97862}}
:root[data-theme="dark"]{--ink:#e8ece9;--muted:#93a09a;--ground:#171d1b;--card:#212927;--line:#33403c;--accent:#6fb3a2;--accent-soft:#26332f;--good:#66b285;--warn:#d4a04c;--bad:#d97862}
body{background:var(--ground);color:var(--ink);font-family:var(--sans);margin:0;padding:20px 16px 48px}
.wrap{max-width:860px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
h1{font-family:var(--serif);font-weight:600;font-size:1.55rem;margin:0;text-wrap:balance}
.headline{display:flex;flex-wrap:wrap;gap:6px 18px;color:var(--muted);font-size:.88rem;margin-top:6px}
.headline strong{color:var(--ink);font-variant-numeric:tabular-nums}
.bar-top{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:10px;font-size:.8rem;color:var(--muted)}
.saving{color:var(--warn);font-weight:600}.ro{color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:16px 18px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:4px 18px}
.lbl{font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:3px}
.val{font-size:1.12rem;font-weight:600;font-variant-numeric:tabular-nums}.sub{font-size:.8rem;color:var(--muted)}
.flag{font-size:.8rem;font-weight:600;color:var(--bad)}
.donext{margin-top:12px;padding-top:12px;border-top:1px dashed var(--line)}
.donext ol{margin:0;padding-left:20px;font-size:.9rem}.donext li{margin:4px 0}
.tag{font-size:.72rem;color:var(--accent);background:var(--accent-soft);border-radius:99px;padding:1px 8px;margin-left:6px;white-space:nowrap}
section h2{font-family:var(--serif);font-size:1.1rem;font-weight:600;margin:0 0 2px}
.blurb{margin:0 0 8px;color:var(--muted);font-size:.82rem}
.rows{background:var(--card);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.row{border-bottom:1px solid var(--ground)}.row:last-child{border-bottom:none}
.rh{display:grid;grid-template-columns:1fr auto auto auto;gap:10px;align-items:center;padding:10px 14px;cursor:pointer;width:100%;background:none;border:none;font:inherit;color:inherit;text-align:left}
.rh:hover{background:var(--ground)}.rh:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.nm{font-weight:600;font-size:.95rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nm i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:8px}
.mb{position:relative;width:110px;height:8px;border-radius:4px;background:var(--accent-soft)}
.mb b{position:absolute;inset:0 auto 0 0;border-radius:4px;background:var(--accent)}.mb b.over{background:var(--bad)}
.mb u{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink)}
.pr{font-size:.85rem;font-variant-numeric:tabular-nums;font-weight:600;min-width:62px;text-align:right}
.wh{font-size:.76rem;color:var(--muted);font-variant-numeric:tabular-nums;min-width:90px;text-align:right}.wh.soon{color:var(--bad);font-weight:600}
.rb{padding:2px 16px 14px;font-size:.87rem}
.money{display:flex;gap:16px;flex-wrap:wrap;color:var(--muted);font-variant-numeric:tabular-nums;margin:6px 0}.money b{color:var(--ink)}
.notes{color:var(--muted);max-width:75ch;margin:6px 0;line-height:1.45}
.ctl{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:10px;padding-top:8px;border-top:1px dashed var(--line)}
select,input,button{font:inherit;font-size:.8rem;color:var(--ink)}
select,input[type=text],input[type=date]{background:var(--card);border:1px solid var(--line);border-radius:5px;padding:5px 7px}
button.b{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:5px 11px;cursor:pointer}button.b:hover{border-color:var(--accent)}
button.p{background:var(--accent);border-color:var(--accent);color:#fff}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
ul.list{list-style:none;margin:0;padding:0;font-size:.9rem}
ul.list li{display:flex;gap:10px;align-items:baseline;padding:6px 0;border-bottom:1px solid var(--ground)}
ul.list li.done span.t{text-decoration:line-through;color:var(--muted)}
.due{margin-left:auto;font-size:.78rem;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.add{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.add input[type=text]{flex:1 1 220px}
time{color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap;font-size:.82rem}
details summary{cursor:pointer;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
footer{color:var(--muted);font-size:.78rem;max-width:70ch}
.ro-mode .ctl,.ro-mode .add{display:none}
</style>
<script type="application/json" id="state">{"student": {"name": "Student Name", "grad_year": 2027, "gpa": null, "sat": null, "act": null}, "budget": {"yearly": 40000, "notes": ""}, "updated": "2026-01-01", "schools": [], "todos": [], "log": []}</script>
<div class="wrap" id="app"></div>
<script>
(function(){
"use strict";
const SRC_STYLE=document.querySelector("style").textContent;
const SRC_SCRIPT=document.currentScript.textContent;
const state=JSON.parse(document.getElementById("state").textContent);
const TIERS=[["lock","Locks","Affordable at sticker or with automatic aid. The financial safety net.","var(--good)"],["conditional_target","Conditional targets","Over budget at sticker, but realistic merit aid brings them under.","var(--accent)"],["merit_lottery","Merit lotteries","Big awards exist but are rare. Apply with eyes open.","var(--warn)"],["long_shot","Long shots","Little or no merit for no-need families. Full pay or need aid only.","var(--bad)"]];
const STATUSES=["researching","visiting","applying","applied","admitted","denied","waitlisted","committed","dropped"];
const app=document.getElementById("app");
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const money=n=>n==null||n===""?"—":"$"+Math.round(+n).toLocaleString();
const km=n=>n==null?"—":"$"+(Math.round(+n/100)/10).toFixed(1)+"k";
const today=()=>new Date().toISOString().slice(0,10);
const days=d=>d?Math.round((new Date(d)-new Date(today()))/864e5):null;
const est=s=>s.npc_estimate??s.est_price??s.coa;
const open=new Set(JSON.parse(sessionStorage.getItem("open")||"[]"));
let saving=false,readOnly=false,timer=null,art=null;

/* ---- persistence: the page is the record; edits republish it ---- */
const SKEL='<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>*,*::before,*::after{box-sizing:border-box}body{margin:0}</style></head><body>';
function documentFor(s){
  const json=JSON.stringify(s).replace(/</g,"\\u003c");
  return SKEL+"<title>"+esc(s.student.name)+" — College Search</title>\n<style>"+SRC_STYLE+"</style>\n"+
    '<script type="application/json" id="state">'+json+"<\/script>\n"+'<div class="wrap" id="app"></div>\n<script>'+SRC_SCRIPT+"<\/script></body></html>";
}
function change(note){
  if(readOnly)return;
  if(note)state.log.push({date:today(),entry:note});
  state.updated=today();
  saving=true;render();
  clearTimeout(timer);timer=setTimeout(publishNow,1200);
}
async function publishNow(){
  if(!art){saving=false;render();return;}
  sessionStorage.setItem("open",JSON.stringify([...open]));
  try{await art.publish(documentFor(state));}
  catch(e){
    if(e&&(e.code==="not_writer"||e.code==="not_granted"||e.code==="consent_required"||e.code==="capability_disabled"||e.code==="not_declared")){readOnly=true;}
    saving=false;render();   /* conflict: the view is already reloading to the winner */
  }
}

/* ---- insights ---- */
function insights(){
  const act=state.schools.filter(s=>s.status!=="dropped");
  const dls=[];
  for(const s of act){if(["admitted","denied","committed"].includes(s.status))continue;
    for(const[l,d]of Object.entries(s.deadlines||{})){const n=days(d);if(n!=null&&n>=0)dls.push({s:s.name,l:l.replace(/_/g," "),d,n});}}
  dls.sort((a,b)=>a.n-b.n);
  const locks=act.filter(s=>s.tier==="lock");
  const cheap=locks.length?locks.reduce((m,s)=>est(s)<est(m)?s:m):null;
  const todos=(state.todos||[]).filter(t=>!t.done);
  const over=todos.filter(t=>t.due&&days(t.due)<0);
  const next=[...over.map(t=>({t:t.text,g:t.school,w:"overdue"})),
    ...dls.filter(x=>x.n<=45).slice(0,3).map(x=>({t:x.l+" deadline",g:x.s,w:x.n+"d"})),
    ...todos.filter(t=>t.due&&days(t.due)>=0).sort((a,b)=>days(a.due)-days(b.due)).map(t=>({t:t.text,g:t.school,w:days(t.due)+"d"})),
    ...todos.filter(t=>!t.due).map(t=>({t:t.text,g:t.school,w:""}))].slice(0,3);
  const nd=dls[0];
  return `<div class="card"><div class="tiles">
    <div><div class="lbl">Next deadline</div>${nd?`<div class="val">${nd.n}d</div><div class="sub">${esc(nd.s)} — ${esc(nd.l)} ${esc(nd.d)}</div>`:`<div class="val">—</div><div class="sub">none upcoming on file</div>`}</div>
    <div><div class="lbl">Cheapest sure path</div>${cheap?`<div class="val">${km(est(cheap))}/yr</div><div class="sub">${esc(cheap.name)}</div>`:`<div class="val">—</div>`}${locks.length<2?`<div class="flag">✚ add a second financial safety</div>`:""}</div>
    <div><div class="lbl">List shape</div><div class="val">${act.length} schools</div><div class="sub">${TIERS.map(([k,t])=>act.filter(s=>s.tier===k).length+" "+t.split(" ")[0].toLowerCase()).join(" · ")}</div></div>
    <div><div class="lbl">Open to-dos</div><div class="val">${todos.length}</div>${over.length?`<div class="flag">⚠ ${over.length} overdue</div>`:`<div class="sub">none overdue</div>`}</div>
  </div>${next.length?`<div class="donext"><div class="lbl">Do next</div><ol>${next.map(n=>`<li>${esc(n.t)}${n.g?`<span class="tag">${esc(n.g)}</span>`:""} <span class="sub">${esc(n.w)}</span></li>`).join("")}</ol></div>`:""}</div>`;
}

/* ---- render ---- */
function render(){
  const act=state.schools.filter(s=>s.status!=="dropped");
  const budget=state.budget.yearly||0;
  const maxP=Math.max(budget*1.4,...act.map(s=>s.coa||0),1);
  const st=state.student;
  let h=`<header><h1>${esc(st.name)} — College Search</h1>
    <div class="headline"><span>Class of <strong>${esc(st.grad_year)}</strong></span>${st.sat?`<span>SAT <strong>${esc(st.sat)}</strong></span>`:""}
    <span>Budget <strong>${money(budget)}/yr</strong></span><span>Updated <strong>${esc(state.updated)}</strong></span></div>
    <div class="bar-top">${saving?`<span class="saving">saving…</span>`:readOnly?`<span class="ro">read-only view</span>`:`<span>changes save automatically for everyone with edit access</span>`}</div></header>`;
  h+=insights();
  TIERS.forEach(([k,title,blurb,color])=>{
    const ss=act.filter(s=>s.tier===k);if(!ss.length)return;
    h+=`<section><h2>${title} <span class="sub" style="font-family:var(--sans)">${ss.length}</span></h2><p class="blurb">${blurb}</p><div class="rows">`;
    ss.forEach(s=>{
      const i=state.schools.indexOf(s),e=est(s),pct=e?Math.min(100,e/maxP*100):0,bp=Math.min(100,budget/maxP*100);
      const nx=Object.entries(s.deadlines||{}).map(([l,d])=>[l,d,days(d)]).filter(x=>x[2]!=null&&x[2]>=0).sort((a,b)=>a[2]-b[2])[0];
      const isOpen=open.has(s.name);
      h+=`<div class="row"><button class="rh" data-toggle="${i}" aria-expanded="${isOpen}">
        <span class="nm"><i style="background:${color}"></i>${esc(s.name)}</span>
        <span class="mb"><b class="${e>budget?"over":""}" style="width:${pct}%"></b><u style="left:${bp}%"></u></span>
        <span class="pr">${km(e)}</span><span class="wh ${nx&&nx[2]<=45?"soon":""}">${nx?esc(nx[0].replace(/_/g," "))+" "+esc(nx[1].slice(5)):esc(s.status==="researching"?"":s.status)}</span></button>`;
      if(isOpen){
        h+=`<div class="rb"><div class="money"><span>sticker <b>${money(s.coa)}</b></span>${s.merit_rate!=null?`<span>merit rate <b>${Math.round(s.merit_rate*100)}%</b></span>`:""}${s.avg_merit?`<span>avg award <b>${money(s.avg_merit)}</b></span>`:""}<span>${s.npc_estimate!=null?"NPC estimate":"est. price"} <b>${money(e)}</b></span></div>
          ${s.next_action?`<div>▸ ${esc(s.next_action)}</div>`:""}${s.notes?`<div class="notes">${esc(s.notes)}</div>`:""}
          <div class="ctl"><label class="sub">status <select data-status="${i}">${STATUSES.map(x=>`<option ${x===s.status?"selected":""}>${x}</option>`).join("")}</select></label>
          <label class="sub">tier <select data-tier="${i}">${TIERS.map(([kk,t])=>`<option value="${kk}" ${kk===s.tier?"selected":""}>${t}</option>`).join("")}</select></label>
          <label class="sub">NPC $ <input type="text" inputmode="numeric" size="7" data-npc="${i}" value="${s.npc_estimate??""}"></label></div></div>`;
      }
      h+=`</div>`;
    });
    h+=`</div></section>`;
  });
  const dropped=state.schools.filter(s=>s.status==="dropped");
  if(dropped.length)h+=`<details><summary>Archived (${dropped.length})</summary><ul class="list">${dropped.map(s=>`<li><span class="t">${esc(s.name)}</span><span class="due"><button class="b" data-restore="${state.schools.indexOf(s)}">restore</button></span></li>`).join("")}</ul></details>`;
  const todos=state.todos||[];
  h+=`<div class="card"><div class="lbl">To-dos</div><ul class="list">${[...todos.filter(t=>!t.done),...todos.filter(t=>t.done)].map(t=>`<li class="${t.done?"done":""}"><input type="checkbox" data-todo="${esc(t.id)}" ${t.done?"checked":""} ${readOnly?"disabled":""} aria-label="done"><span class="t">${esc(t.text)}</span>${t.school?`<span class="tag">${esc(t.school)}</span>`:""}${t.due?`<span class="due">${esc(t.due)}</span>`:""}</li>`).join("")}</ul>
    <div class="add"><input type="text" id="todo-text" placeholder="Add a to-do…"><input type="date" id="todo-due"><button class="b p" id="todo-add">Add</button></div></div>`;
  h+=`<div class="card"><div class="lbl">Journal</div><ul class="list">${state.log.slice().reverse().map(e=>`<li><time>${esc(e.date)}</time><span>${esc(e.entry)}</span></li>`).join("")}</ul>
    <div class="add"><input type="text" id="log-text" placeholder="Add a journal entry…"><button class="b p" id="log-add">Add</button></div></div>`;
  h+=`<footer>Money figures come from Common Data Set / IPEDS data (1–2 years old) and the family's own research — none are offers; verify with each school's net price calculator. The dark mark on each bar is the ${money(budget)}/yr budget.</footer>`;
  app.innerHTML=h;
  app.classList.toggle("ro-mode",readOnly);
}

/* ---- interactions ---- */
app.addEventListener("click",ev=>{
  const t=ev.target.closest("[data-toggle],[data-restore],#todo-add,#log-add");if(!t)return;
  if(t.dataset.toggle!==undefined){const s=state.schools[+t.dataset.toggle];open.has(s.name)?open.delete(s.name):open.add(s.name);sessionStorage.setItem("open",JSON.stringify([...open]));render();return;}
  if(t.dataset.restore!==undefined){const s=state.schools[+t.dataset.restore];s.status="researching";change(`Restored ${s.name}.`);return;}
  if(t.id==="todo-add"){const x=document.getElementById("todo-text").value.trim();if(!x)return;state.todos.push({id:"t"+Date.now().toString(36),text:x,done:false,school:"",due:document.getElementById("todo-due").value||""});change(null);return;}
  if(t.id==="log-add"){const x=document.getElementById("log-text").value.trim();if(x)change(x);}
});
app.addEventListener("change",ev=>{
  const t=ev.target;
  if(t.dataset.status!==undefined){const s=state.schools[+t.dataset.status];s.status=t.value;change(`${s.name} → ${t.value}.`);}
  else if(t.dataset.tier!==undefined){const s=state.schools[+t.dataset.tier];s.tier=t.value;change(`${s.name} moved to ${t.value.replace(/_/g," ")}.`);}
  else if(t.dataset.npc!==undefined){const s=state.schools[+t.dataset.npc];const v=t.value.replace(/[^0-9]/g,"");s.npc_estimate=v?+v:null;s.npc_run=!!v;change(v?`Net price calculator for ${s.name}: ${money(+v)}/yr.`:null);}
  else if(t.dataset.todo!==undefined){const td=state.todos.find(x=>x.id===t.dataset.todo);if(td){td.done=t.checked;change(null);}}
});

render();
claude.use("artifact").then(a=>{art=a;if(!a){readOnly=true;render();}});
})();
</script>
